[project]
name = "ai-courtroom-game-backend"
version = "0.1.0"
description = "FastAPI backend for AI Courtroom Game"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=2.44.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30.0",
]

[tool.ruff]
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
